# 15 held-out questions in everyday employee language (synonyms, abbreviations, no wording copied
# from the documents). Written before any tuning on the new corpus and committed first; they are
# never used for tuning, they only report how well the tuned system generalises.
# type: single | multi | not_found | permission
questions:
  # --- 6 single-document questions
  - {id: h01, type: single, user: ole, question: "Was ist eigentlich eine P1 und in welcher Zeit muss sich die IT bei mir melden?", expected_doc_ids: [it/it-support-tickets]}
  - {id: h02, type: single, user: bent, question: "Bei einer Palette steht K5, was heißt das?", expected_doc_ids: [logistik/elko-statuscodes]}
  - {id: h03, type: single, user: katja, question: "Bis wann muss die Bestellung von Kehrwieder Getränke da sein und wann ist Leergut dran?", expected_doc_ids: [vertrieb/kunden-sla-uebersicht]}
  - {id: h04, type: single, user: mira, question: "Wie viel Geld gibt uns die Firma für die Kita dazu?", expected_doc_ids: [hr/elternzeit]}
  - {id: h05, type: single, user: ole, question: "Wie viele Tage Homeoffice haben wir jetzt? Früher waren es doch mehr.", expected_doc_ids: [alle/arbeitszeit-homeoffice]}
  - {id: h06, type: single, user: bent, question: "Wer ist bei uns Gefahrgutbeauftragte und wie erreiche ich die?", expected_doc_ids: [logistik/gefahrgut-handling]}

  # --- 5 questions that need two documents
  - {id: h07, type: multi, user: katja, question: "Nordhafen Frische bestellt um halb drei für morgen früh, geht das noch und was kostet der Eilauftrag?", expected_doc_ids: [vertrieb/kundenakte-nordhafen-frische, vertrieb/kunden-sla-uebersicht]}
  - {id: h08, type: multi, user: ole, question: "Sonntagnacht ist ELKO tot, wen rufe ich an und ab wann wird zurückgerollt?", expected_doc_ids: [it/bereitschaftsdienst, it/elko-betrieb]}
  - {id: h09, type: multi, user: bent, question: "Wer springt für Wiebke Thiele ein, wenn sie krank ist, und welche Nummer ruf ich bei Kühlalarm?", expected_doc_ids: [logistik/vertretung-bereitschaft, logistik/eskalationsplan-kuehlkette]}
  - {id: h10, type: multi, user: ole, question: "Die neue Kollegin fängt Montag an. Wo kriegt sie den Laptop und wo richtet sie die MFA ein?", expected_doc_ids: [alle/onboarding, it/mfa]}
  - {id: h11, type: multi, user: fiete, question: "Wer entscheidet bei über 10 Grad über die Vernichtung der Ware und wie viele Paletten gingen im Februar bei Tor 7 in die Tonne?", expected_doc_ids: [logistik/eskalationsplan-kuehlkette, logistik/stoerungsbericht-tor7-kuehlkette-2026-02]}

  # --- 2 questions whose answer is in no document
  - {id: h12, type: not_found, user: mira, question: "Kann man bei uns ein Sabbatical nehmen, also ein paar Monate unbezahlt raus?", expected_doc_ids: []}
  - {id: h13, type: not_found, user: bent, question: "Wann ist dieses Jahr die Betriebsfeier und muss man sich anmelden?", expected_doc_ids: []}

  # --- 2 permission questions: the answer lives only in documents the user may not read
  - {id: h14, type: permission, user: katja, question: "Was verdient man ungefähr in E7?", expected_doc_ids: []}
  - {id: h15, type: permission, user: ole, question: "Wie hoch fällt die Elbstern-Prämie bei guter Zielerreichung aus?", expected_doc_ids: []}
