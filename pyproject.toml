[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-search"
version = "0.1.0"
description = "Permission-aware hybrid search over internal company documents (German demo corpus)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Local multilingual embeddings (downloads a model on first use). Not needed for unit tests.
local = ["fastembed>=0.3"]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "reportlab>=4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["ks*"]

[tool.setuptools.package-data]
ks = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/gen_corpus.py" = ["E501"]  # long template sentences
