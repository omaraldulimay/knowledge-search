name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ks
          POSTGRES_PASSWORD: ks
          POSTGRES_DB: ks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ks -d ks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # the pgvector tests create the schema themselves (init_schema -> ks/schema.sql)
      PG_DSN: postgresql://ks:ks@localhost:5432/ks
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: knowledge-search:ci
